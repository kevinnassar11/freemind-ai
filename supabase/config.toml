project_id = "freemind-ai"

# This function verifies the Firebase ID token itself (fetches Firebase's
# JWKS directly - see functions/stamp-role/index.ts) so it can act correctly
# even before the gateway's own third-party-auth check would recognize the
# caller as `authenticated` - which is the exact claim this function exists
# to add in the first place. Everything else on this project (Postgrest,
# Realtime) goes through the normal Firebase third-party auth integration
# configured in the Supabase dashboard - see SETUP.md.
[functions.stamp-role]
verify_jwt = false

# NOT DEPLOYED - see functions/notify-favorites/index.ts for why. Listed here
# so the config is ready once it is deployed. This function checks its caller
# against SUPABASE_SERVICE_ROLE_KEY itself (it's only ever meant to be invoked
# by the scheduled pg_cron job, never by an end user), so the gateway's normal
# end-user JWT check is off, same reasoning as the other two functions.
[functions.notify-favorites]
verify_jwt = false
